name: Windows Dist

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-dist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build windowsDist
        run: ./gradlew windowsDist --no-daemon

      - name: Upload Windows zip
        uses: actions/upload-artifact@v5
        with:
          name: WebVideoQC-windows
          path: build/distributions/*-windows.zip
          if-no-files-found: error
