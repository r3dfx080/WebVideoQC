spring.application.name=WebVideoQC
spring.web.error.include-message=always
logging.level.org.springframework.web=TRACE
server.port=8081
debug=true
webvideoqc.ffprobe.binary=C:/ffmpeg/bin/ffprobe.exe
webvideoqc.ffprobe.timeout-seconds=1800
webvideoqc.ffmpeg.binary=C:/ffmpeg/bin/ffmpeg.exe
webvideoqc.user.workdir=I:/