<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebVideoQC</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<h1>WebVideoQC</h1>
<div class="layout-grid">
  <section class="panel panel-workdir">
    <h2 class="panel-title">Workdir files</h2>
    <div class="placeholder"></div>
  </section>

  <section class="panel panel-actions">
    <h2 class="panel-title">Analyze / Load</h2>
    <div class="placeholder-stack">
      <div class="placeholder-chip">Analyze</div>
      <div class="placeholder-chip">Load</div>
    </div>
  </section>

  <section class="panel panel-reports">
    <h2 class="panel-title">Previous reports here</h2>
    <div class="placeholder"></div>
  </section>

  <section class="panel panel-spacer">
    <div class="placeholder"></div>
  </section>

  <section class="panel panel-metadata">
    <h2 class="panel-title">Metadata</h2>
    <div id="meta">No data</div>
  </section>

  <section class="panel panel-chart">
    <div id="lumaChartScroll" class="chart-scroll">
      <div id="lumaChartInner" class="chart-inner">
        <canvas id="lumaChart"></canvas>
      </div>
    </div>
  </section>

  <section class="panel panel-preview">
    <h2 class="panel-title">Frame preview</h2>
    <label class="overlay-option">
      <input id="overlayToggle" type="checkbox" checked> Overlay pixels outside of broadcast range
    </label>
    <div id="previewInfo">Click a chart point to preview a frame</div>
    <img id="previewImage">
  </section>
</div>
<script>
  let chart;
  let previewObjectUrl;
  let currentPreviewFrame = null;
  let latestReport = null;
  let xZoomScale = 1;
  let pendingZoomFrame = null;
  let pendingWheelPayload = null;
  const MIN_X_ZOOM_SCALE = 1;
  const MAX_X_ZOOM_SCALE = 20;
  const WHEEL_ZOOM_SENSITIVITY = 0.0015;

  async function fetchLatestReport() {
    const urls = ["/api/videos/reports/latest", "/reports/latest"];
    let lastError = null;
    for (const url of urls) {
      try {
        const response = await fetch(url);
        if (!response.ok) {
          lastError = new Error("HTTP " + response.status + " for " + url);
          continue;
        }
        return await response.json();
      } catch (e) {
        lastError = e;
      }
    }
    throw lastError || new Error("Report endpoint not available");
  }

  function renderMetadata(report) {
    const esc = (v) => String(v)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");

    const formatDuration = (value) => {
      if (!value) return "—";
      if (typeof value !== "string") return String(value);

      const simple = value.match(/^(\d{2}):(\d{2}):(\d{2})(?:\.\d+)?$/);
      if (simple) {
        return `${simple[1]}:${simple[2]}:${simple[3]}`;
      }

      const iso = value.match(/^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?$/);
      if (!iso) return value;

      const h = Number(iso[1] || 0);
      const m = Number(iso[2] || 0);
      const s = Number(iso[3] || 0);
      const totalSeconds = Math.floor(h * 3600 + m * 60 + s);
      const hh = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
      const mm = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, "0");
      const ss = String(totalSeconds % 60).padStart(2, "0");
      return `${hh}:${mm}:${ss}`;
    };
    const formatVideoPath = (value) => {
      if (!value) return "—";
      const text = String(value);
      return text.replace(/^file:\/\/\/+/i, "");
    };

    const formatBitrateMbps = (bitRate) => {
      if (bitRate == null || bitRate === "") return "—";
      const n = Number(bitRate);
      if (!Number.isFinite(n)) return "—";
      const mbps = (n / 1_000_000).toFixed(2).replace(/\.?0+$/, "");
      return `${mbps} Mb/s`;
    };
    const vm = (report && report.videoMetadata) || {};
    const rows = [
      ["Video path", formatVideoPath(report && report.videoPath ? report.videoPath : "—")],
      ["Resolution", (vm.width && vm.height) ? (vm.width + " x " + vm.height) : "—"],
      ["Codec", vm.codec || "—"],
      ["Pixel format", vm.pixelFormat || vm.pixFmt || "—"],
      ["Color range", vm.colorRange || "—"],
      ["Field order", vm.fieldOrder || "—"],
      ["FPS", vm.fps != null ? vm.fps : "—"],
      ["Duration", formatDuration(vm.duration)],
      ["Bitrate", formatBitrateMbps(vm.bitRate)]
    ];

    const meta = document.getElementById("meta");
    meta.classList.add("meta-list");
    meta.innerHTML = rows.map(([label, value]) =>
      "<div class=\"meta-row\"><span class=\"meta-label\">" + esc(label) + "</span><span class=\"meta-value\">" + esc(value) + "</span></div>"
    ).join("");
  }

  function getChartViewportWidth(chartScroll) {
    return Math.max(1, chartScroll.clientWidth);
  }

  function applyHorizontalZoom() {
    const chartScroll = document.getElementById("lumaChartScroll");
    const chartInner = document.getElementById("lumaChartInner");
    if (!chartScroll || !chartInner) {
      return;
    }
    const baseWidth = getChartViewportWidth(chartScroll);
    const zoomedWidth = Math.max(1, baseWidth * xZoomScale);
    chartInner.style.width = zoomedWidth + "px";
    if (chart) {
      chart.resize();
    }
  }
  function flushChartZoom() {
    pendingZoomFrame = null;
    const payload = pendingWheelPayload;
    pendingWheelPayload = null;
    if (!payload) {
      return;
    }
    const { chartScroll, deltaY, clientX } = payload;
    const chartInner = document.getElementById("lumaChartInner");
    if (!chartScroll || !chartInner) {
      return;
    }

    const previousScale = xZoomScale;
    const zoomFactor = Math.exp(-deltaY * WHEEL_ZOOM_SENSITIVITY);
    const nextScale = Math.max(MIN_X_ZOOM_SCALE, Math.min(MAX_X_ZOOM_SCALE, previousScale * zoomFactor));
    if (Math.abs(nextScale - previousScale) < 0.0001) {
      return;
    }

    const rect = chartScroll.getBoundingClientRect();
    const mouseX = clientX - rect.left;
    const previousContentWidth = Math.max(1, chartInner.scrollWidth);
    const anchorRatio = (chartScroll.scrollLeft + mouseX) / previousContentWidth;

    xZoomScale = nextScale;
    applyHorizontalZoom();
    const nextContentWidth = Math.max(1, chartInner.scrollWidth);
    const nextAnchorX = anchorRatio * nextContentWidth;
    const maxScrollLeft = Math.max(0, nextContentWidth - getChartViewportWidth(chartScroll));
    chartScroll.scrollLeft = Math.min(maxScrollLeft, Math.max(0, nextAnchorX - mouseX));
  }

  function onChartWheel(event) {
    event.preventDefault();
    pendingWheelPayload = {
      chartScroll: event.currentTarget,
      deltaY: event.deltaY,
      clientX: event.clientX
    };
    if (pendingZoomFrame !== null) {
      return;
    }
    pendingZoomFrame = requestAnimationFrame(flushChartZoom);
  }

  function setupChartZoom() {
    const chartScroll = document.getElementById("lumaChartScroll");
    if (!chartScroll || chartScroll.dataset.zoomInitialized === "true") {
      return;
    }
    chartScroll.addEventListener("wheel", onChartWheel, { passive: false });
    chartScroll.dataset.zoomInitialized = "true";
  }

  function setupOverlayToggleRerender() {
    const overlayToggle = document.getElementById("overlayToggle");
    if (!overlayToggle || overlayToggle.dataset.rerenderInitialized === "true") {
      return;
    }
    overlayToggle.addEventListener("change", () => {
      if (currentPreviewFrame === null) {
        return;
      }
      loadFramePreview(currentPreviewFrame);
    });
    overlayToggle.dataset.rerenderInitialized = "true";
  }

  function drawChart(report) {
    const frames = report.frameStatsList || [];
    const labels = frames.map((_, i) => i);
    const chartScroll = document.getElementById("lumaChartScroll");
    const rawBitDepth = Number(report && report.videoMetadata ? report.videoMetadata.bitDepth : NaN);
    const bitDepth = Number.isFinite(rawBitDepth) ? Math.floor(rawBitDepth) : null;
    const yAxisMax = bitDepth && bitDepth > 0 && bitDepth <= 30
      ? (Math.pow(2, bitDepth) - 1)
      : 255;

    xZoomScale = 1;
    applyHorizontalZoom();
    if (chartScroll) {
      chartScroll.scrollLeft = 0;
    }

    const canvas = document.getElementById("lumaChart");
    const existingChart = typeof Chart.getChart === "function" ? Chart.getChart(canvas) : null;
    const data = {
      labels: labels,
      datasets: [
        { label: "YAVG", data: frames.map(f => f.yavg), borderWidth: 1, pointRadius: 0 },
        { label: "YMAX", data: frames.map(f => f.ymax), borderWidth: 1, pointRadius: 0 },
        { label: "YMIN", data: frames.map(f => f.ymin), borderWidth: 1, pointRadius: 0 },
        { label: "YHIGH", data: frames.map(f => f.yhigh), borderWidth: 1, pointRadius: 0 }
      ]
    };

    if (existingChart) {
      existingChart.destroy();
    }
    if (chart && chart !== existingChart) {
      chart.destroy();
    }
    chart = null;

    try {
      chart = new Chart(canvas, {
        type: "line",
        data: data,
        options: {
          animation: false,
          responsive: true,
          maintainAspectRatio: false,
          interaction: {
            mode: "nearest",
            intersect: false,
            axis: "x"
          },
          onClick: (evt, _elements, chartInstance) => {
            const elements = chartInstance.getElementsAtEventForMode(
              evt,
              "nearest",
              { intersect: false, axis: "x" },
              false
            );
            if (!elements || !elements.length) {
              return;
            }
            const first = elements[0];
            const frame = first.index != null ? first.index : first._index;
            if (frame == null) {
              return;
            }
            loadFramePreview(frame);
          },
          scales: {
            x: { title: { display: true, text: "Frame" } },
            y: { title: { display: true, text: "Luma" }, min: 0, max: yAxisMax }
          }
        }
      });
    } catch (e) {
      const orphanChart = typeof Chart.getChart === "function" ? Chart.getChart(canvas) : null;
      if (orphanChart) {
        orphanChart.destroy();
      }
      chart = null;
      throw e;
    }
  }

  async function loadReport() {
    const meta = document.getElementById("meta");
    meta.textContent = "Loading...";
    try {
      const report = await fetchLatestReport();
      latestReport = report;
      renderMetadata(report);
      drawChart(report);
    } catch (e) {
      meta.textContent = "Failed to load report: " + e.message;
    }
  }

  async function loadFramePreview(frame) {
    currentPreviewFrame = frame;
    const videoPath = latestReport && latestReport.videoPath
      ? String(latestReport.videoPath).trim()
      : "";
    const overlay = document.getElementById("overlayToggle").checked;
    const info = document.getElementById("previewInfo");
    const image = document.getElementById("previewImage");


    info.textContent = "Loading frame " + frame + "...";
    try {
      let url = "/api/videos/frame-preview?frame=" + encodeURIComponent(frame)
          + "&overlay=" + encodeURIComponent(overlay);
      if (videoPath) {
        url += "&path=" + encodeURIComponent(videoPath);
      }
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }
      const blob = await response.blob();
      if (previewObjectUrl) {
        URL.revokeObjectURL(previewObjectUrl);
      }
      previewObjectUrl = URL.createObjectURL(blob);
      image.src = previewObjectUrl;
      info.textContent = "Frame " + frame;
    } catch (e) {
      info.textContent = "Failed to load frame: " + e.message;
    }
  }

  setupChartZoom();
  setupOverlayToggleRerender();
  window.addEventListener("resize", applyHorizontalZoom);
  loadReport();
</script>
</body>
</html>
